<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyOvertimes</title>
  <script>
    if (
      localStorage.getItem("myovertimes-theme") === "dark" ||
      (!localStorage.getItem("myovertimes-theme") &&
        window.matchMedia("(prefers-color-scheme: dark)").matches)
    ) {
      document.documentElement.classList.add("dark");
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
  <!--
    index.html berfungsi sebagai gerbang awal aplikasi.
    Tidak menampilkan konten apa pun ke pengguna selain layar loading singkat,
    karena tugasnya hanya mengecek status login lalu mengarahkan:
    - Belum login -> login.html
    - Sudah login  -> dashboard.html
  -->
  <div class="flex flex-col items-center gap-3">
    <svg class="animate-spin h-8 w-8 text-blue-600" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    <p class="text-sm text-gray-500 dark:text-gray-400">Memuat MyOvertimes...</p>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      window.location.replace(user ? "dashboard.html" : "login.html");
    });
  </script>
</body>
</html>
