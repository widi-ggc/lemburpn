<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MyOvertimes</title>

  <!-- Mencegah "flash" tema salah sebelum Tailwind dimuat -->
  <script>
    if (
      localStorage.getItem("myovertimes-theme") === "dark" ||
      (!localStorage.getItem("myovertimes-theme") &&
        window.matchMedia("(prefers-color-scheme: dark)").matches)
    ) {
      document.documentElement.classList.add("dark");
    }
  </script>

  <!-- Tailwind CSS (CDN, tanpa build step, sesuai spesifikasi proyek) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: {
              50: "#eff6ff",
              100: "#dbeafe",
              500: "#3b82f6",
              600: "#2563eb",
              700: "#1d4ed8",
            },
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200">

  <!-- Tombol Dark Mode -->
  <button
    id="theme-toggle"
    type="button"
    aria-label="Ganti tema gelap/terang"
    class="fixed top-4 right-4 z-10 inline-flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-gray-800 shadow hover:shadow-md text-gray-600 dark:text-gray-300 transition"
  >
    <svg class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.364 6.364l-1.06-1.06M6.697 6.697l-1.06-1.06m12.727 0l-1.06 1.06M6.697 17.303l-1.06 1.06M16.5 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
    </svg>
    <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
    </svg>
  </button>

  <main class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">

      <!-- Branding: teks saja, tanpa logo -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-primary-600 dark:text-primary-500 tracking-tight">MyOvertimes</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manajemen Lembur Karyawan</p>
      </div>

      <!-- Kartu Login -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg hover:shadow-xl transition p-6 sm:p-8">
        <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-6">Masuk ke akun Anda</h2>

        <!-- Kotak pesan error -->
        <div
          id="login-error"
          class="hidden mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2 dark:bg-red-900/30 dark:text-red-300 dark:border-red-800"
          role="alert"
        ></div>

        <form id="login-form" novalidate>
          <!-- Email -->
          <div class="mb-4">
            <label for="login-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
              Email
            </label>
            <input
              type="email"
              id="login-email"
              name="email"
              autocomplete="email"
              required
              placeholder="nama@perusahaan.com"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-3 py-2.5 text-sm placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition"
            />
          </div>

          <!-- Password -->
          <div class="mb-2">
            <label for="login-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
              Password
            </label>
            <div class="relative">
              <input
                type="password"
                id="login-password"
                name="password"
                autocomplete="current-password"
                required
                placeholder="Masukkan password"
                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-3 py-2.5 pr-10 text-sm placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition"
              />
              <button
                type="button"
                id="toggle-password"
                aria-label="Tampilkan password"
                class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
              >
                <!-- Ikon mata terbuka (password tersembunyi) -->
                <svg class="icon-eye-open w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <!-- Ikon mata tercoret (password terlihat) -->
                <svg class="icon-eye-closed w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me -->
          <div class="flex items-center justify-between mt-3 mb-6">
            <label class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300 cursor-pointer select-none">
              <input
                type="checkbox"
                id="login-remember"
                class="w-4 h-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500"
              />
              Ingat saya
            </label>
          </div>

          <!-- Tombol Submit -->
          <button
            type="submit"
            id="login-submit"
            class="w-full inline-flex items-center justify-center rounded-lg bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold px-4 py-2.5 transition focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800"
          >
            Masuk
          </button>
        </form>
      </div>

      <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-6">
        &copy; <span id="current-year"></span> MyOvertimes. Akun dibuat oleh Admin.
      </p>
    </div>
  </main>

  <script type="module">
    import { initTheme } from "./js/utils.js";
    import { initLoginPage } from "./js/auth.js";

    initTheme("theme-toggle");
    initLoginPage();

    document.getElementById("current-year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
